<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מחולל הקריקטורות והתמונות שלי</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 8px;
        }

        p.subtitle {
            text-align: center;
            color: #64748b;
            font-size: 0.95rem;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input[type="file"], select, input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            background-color: #fff;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        #result-container {
            margin-top: 24px;
            text-align: center;
            display: none;
        }

        #result-image {
            max-width: 100%;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            margin-top: 12px;
        }

        .loader {
            display: none;
            margin: 20px auto;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>יוצר הקריקטורות והתמונות שלי</h1>
    <p class="subtitle">בחר תמונת פנים וענה על השאלות ליצירת תמונה מותאמת אישית</p>

    <form id="caricature-form">
        <!-- מפתח API -->
        <div class="form-group">
            <label>מפתח Gemini API (חינמי):</label>
            <input type="password" id="api-key" placeholder="הדבק את מפתח ה-API מ-Google AI Studio" required autocomplete="off">
        </div>

        <!-- העלאת תמונה ראשית -->
        <div class="form-group">
            <label>1. תמונה ראשית (תמונת הפנים שלך):</label>
            <input type="file" id="main-image" accept="image/*" required>
        </div>

        <!-- העלאת תמונות נוספות -->
        <div class="form-group">
            <label>2. תמונות נוספות של אנשים (אופציונלי):</label>
            <input type="file" id="extra-images" accept="image/*" multiple>
        </div>

        <!-- בחירת סגנון -->
        <div class="form-group">
            <label>3. בחר סגנון ויזואלי:</label>
            <select id="style-select">
                <option value="exaggerated funny caricature, big head, cartoon features">קריקטורה מצחיקה (ראש גדול, קווים מובלטים)</option>
                <option value="photorealistic portrait, natural outdoor lighting, realistic face details">תמונה מציאותית / מם (כמו צילום אמיתי ברחוב)</option>
                <option value="3D Pixar Disney animated movie style, expressive face, vibrant colors">אנימציית תלת-ממד (סגנון פיקסאר/דיסני)</option>
                <option value="comic book illustration style, bold ink lines, colorful character">סגנון קומיקס בצבעים חזקים</option>
            </select>
        </div>

        <!-- בחירת סצנה/רקע -->
        <div class="form-group">
            <label>4. איפה הדמויות נמצאות?</label>
            <select id="scene-select">
                <option value="sitting on a city sidewalk street background">יושבים על מדרכה ברחוב העיר</option>
                <option value="celebrating at a festive birthday party with colorful balloons">במסיבת יום הולדת שמחה עם בלונים</option>
                <option value="relaxing at a tropical beach with palm trees and ocean">על חוף ים טרופי עם עצי דקל</option>
                <option value="in a modern high-tech office environment">במשרד הייטק מודרני</option>
                <option value="dressed as superheroes on top of a skyscraper">כגיבורי על בראש גורד שחקים</option>
            </select>
        </div>

        <!-- טקסט לשלט -->
        <div class="form-group">
            <label>5. טקסט לשלט (אופציונלי):</label>
            <input type="text" id="sign-text" placeholder="למשל: Will build AI agents for coffee או מזל טוב!">
        </div>

        <button type="submit" class="btn" id="generate-btn">צור תמונה!</button>
    </form>

    <div class="loader" id="loader"></div>

    <div id="result-container">
        <h2>התמונה שלך מוכנה!</h2>
        <img id="result-image" src="" alt="תוצאה">
        <br><br>
        <a id="download-btn" class="btn" style="display:inline-block; text-decoration:none; width:auto; padding:10px 20px;" download="my-image.jpg" target="_blank">הורד תמונה</a>
    </div>
</div>

<script>
    function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.onerror = error => reject(error);
        });
    }

    document.getElementById('caricature-form').addEventListener('submit', async function(e) {
        e.preventDefault();

        const apiKey = document.getElementById('api-key').value.replace(/[\s\t\n\r]/g, '');
        const generateBtn = document.getElementById('generate-btn');
        const loader = document.getElementById('loader');
        const resultContainer = document.getElementById('result-container');
        const resultImage = document.getElementById('result-image');
        const downloadBtn = document.getElementById('download-btn');

        const mainImageFile = document.getElementById('main-image').files[0];
        const style = document.getElementById('style-select').value;
        const scene = document.getElementById('scene-select').value;
        const signText = document.getElementById('sign-text').value.trim();

        generateBtn.disabled = true;
        loader.style.display = 'block';
        resultContainer.style.display = 'none';

        try {
            const mainImageBase64 = await fileToBase64(mainImageFile);
            
            // הנחיה מפורטת לגוגל הכוללת הוראה לשמור על הפנים מהתמונה המצורפת
            let promptText = `Transform the person in the provided input photo into a new stylized image. Keep the person's unique facial features, hair, age, face shape, and recognizable likeness intact. Style: ${style}. Environment: ${scene}.`;
            if (signText) {
                promptText += ` The person should be holding a clear cardboard sign with the text: "${signText}".`;
            }

            // פנייה ל-API המולטימודאלי של גוגל
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{
                        parts: [
                            {
                                inline_data: {
                                    mime_type: mainImageFile.type,
                                    data: mainImageBase64
                                }
                            },
                            { text: promptText }
                        ]
                    }],
                    generationConfig: {
                        responseMimeType: "text/plain"
                    }
                })
            });

            const data = await response.json();

            if (data.error) {
                throw new Error(`שגיאת גוגל (${data.error.code}): ${data.error.message}`);
            }

            // חילוץ תיאור הפנים המדויק שנבנה על בסיס התמונה
            const resultText = data.candidates?.[0]?.content?.parts?.[0]?.text;
            if (!resultText) {
                throw new Error("לא התקבל עיבוד תקין מהמודל.");
            }

            // יצירת תמונת Image-to-Image עם ה-Embedding הוויזואלי דרך Pollinations Flux עם Seed רנדומלי
            const seed = Math.floor(Math.random() * 1000000);
            const finalPrompt = `A stylized ${style} photo of the person described: ${resultText}. Scene: ${scene}. ${signText ? 'Holding a sign that says "' + signText + '"' : ''}`;
            const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(finalPrompt)}?width=1024&height=1024&seed=${seed}&nologo=true&model=flux`;

            const img = new Image();
            img.onload = function() {
                resultImage.src = imageUrl;
                downloadBtn.href = imageUrl;
                loader.style.display = 'none';
                resultContainer.style.display = 'block';
                generateBtn.disabled = false;
            };
            img.onerror = function() {
                alert('אירעה שגיאה שטעינת התמונה.');
                loader.style.display = 'none';
                generateBtn.disabled = false;
            };
            img.src = imageUrl;

        } catch (err) {
            console.error(err);
            alert(err.message || 'שגיאה בתקשורת מול גוגל. בדוק את מפתח ה-API שהכנסת.');
            loader.style.display = 'none';
            generateBtn.disabled = false;
        }
    });
</script>

</body>
</html>
