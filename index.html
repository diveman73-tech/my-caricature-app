<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מחולל הקריקטורות והתמונות שלי</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 8px;
        }

        p.subtitle {
            text-align: center;
            color: #64748b;
            font-size: 0.95rem;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .hint {
            font-size: 0.82rem;
            color: #64748b;
            margin-top: 6px;
        }

        input[type="file"], select, input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            background-color: #fff;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        #result-container {
            margin-top: 24px;
            text-align: center;
            display: none;
        }

        #result-image {
            max-width: 100%;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            margin-top: 12px;
        }

        #status-line {
            font-size: 0.85rem;
            color: #64748b;
            margin-top: 8px;
            min-height: 1.2em;
        }

        .loader {
            display: none;
            margin: 20px auto;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>יוצר הקריקטורות והתמונות</h1>
    <p class="subtitle">בחר תמונות וענה על השאלות כדי ליצור תמונה ייחודית ב-AI</p>

    <form id="caricature-form">
        <!-- מפתח API -->
        <div class="form-group">
            <label>מפתח Gemini API (חינמי):</label>
            <input type="password" id="api-key" placeholder="הדבק את מפתח ה-API מ-Google AI Studio" required autocomplete="off">
            <p class="hint">המפתח נשלח ישירות מול גוגל בלבד ב-Header מאובטח.</p>
        </div>

        <!-- העלאת תמונה ראשית -->
        <div class="form-group">
            <label>1. תמונה ראשית (הדמות המרכזית):</label>
            <input type="file" id="main-image" accept="image/*" required>
        </div>

        <!-- העלאת תמונות נוספות -->
        <div class="form-group">
            <label>2. תמונות נוספות של אנשים אחרים (אופציונלי):</label>
            <input type="file" id="extra-images" accept="image/*" multiple>
            <p class="hint">כל תמונה נוספת תתווסף כדמות נוספת בסצנה.</p>
        </div>

        <!-- בחירת סגנון -->
        <div class="form-group">
            <label>3. בחר סגנון ויזואלי:</label>
            <select id="style-select">
                <option value="exaggerated funny caricature art, big head, expressive cartoon features">קריקטורה מצחיקה (ראש גדול, קווים מובלטים)</option>
                <option value="realistic meme photograph, detailed portrait, authentic outdoor lighting">תמונה מציאותית / מם (כמו צילום אמיתי ברחוב)</option>
                <option value="3D Pixar Disney style animated character, expressive face, vibrant colors">אנימציית תלת-ממד (סגנון פיקסאר/דיסני)</option>
                <option value="comic book illustration style, bold ink outlines, vibrant colors">סגנון קומיקס בצבעים חזקים</option>
            </select>
        </div>

        <!-- בחירת סצנה/רקע -->
        <div class="form-group">
            <label>4. איפה הדמויות נמצאות?</label>
            <select id="scene-select">
                <option value="sitting on a city sidewalk street background">יושבים על מדרכה ברחוב העיר</option>
                <option value="celebrating at a festive birthday party with colorful balloons">במסיבת יום הולדת שמחה עם בלונים</option>
                <option value="relaxing at a tropical beach with palm trees and ocean">על חוף ים טרופי עם עצי דקל</option>
                <option value="in a modern high-tech office environment">במשרד הייטק מודרני</option>
                <option value="dressed as superheroes standing on top of a skyscraper">כגיבורי על בראש גורד שחקים</option>
            </select>
        </div>

        <!-- טקסט לשלט -->
        <div class="form-group">
            <label>5. טקסט לשלט (אופציונלי):</label>
            <input type="text" id="sign-text" placeholder="למשל: Will build AI agents for coffee או מזל טוב!">
        </div>

        <button type="submit" class="btn" id="generate-btn">צור תמונה!</button>
    </form>

    <div class="loader" id="loader"></div>
    <div id="status-line"></div>

    <div id="result-container">
        <h2>התמונה שלך מוכנה!</h2>
        <img id="result-image" src="" alt="תמונה סופית">
        <br><br>
        <a id="download-btn" class="btn" style="display:inline-block; text-decoration:none; width:auto; padding:10px 20px;" download="caricature.jpg" target="_blank">הורד תמונה</a>
    </div>
</div>

<script>
    function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.onerror = error => reject(error);
        });
    }

    async function callGeminiApi(apiKey, modelName, apiVersion, parts) {
        const geminiUrl = `https://generativelanguage.googleapis.com/${apiVersion}/models/${modelName}:generateContent`;

        const response = await fetch(geminiUrl, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'x-goog-api-key': apiKey
            },
            body: JSON.stringify({
                contents: [{ parts: parts }]
            })
        });

        return await response.json();
    }

    function setStatus(text) {
        document.getElementById('status-line').textContent = text;
    }

    document.getElementById('caricature-form').addEventListener('submit', async function(e) {
        e.preventDefault();

        const apiKey = document.getElementById('api-key').value.replace(/[\s\t\n\r]/g, '');
        const generateBtn = document.getElementById('generate-btn');
        const loader = document.getElementById('loader');
        const resultContainer = document.getElementById('result-container');
        const resultImage = document.getElementById('result-image');
        const downloadBtn = document.getElementById('download-btn');

        const mainImageFile = document.getElementById('main-image').files[0];
        const extraImageFiles = Array.from(document.getElementById('extra-images').files);

        const style = document.getElementById('style-select').value;
        const scene = document.getElementById('scene-select').value;
        const signText = document.getElementById('sign-text').value.trim();

        generateBtn.disabled = true;
        loader.style.display = 'block';
        resultContainer.style.display = 'none';
        setStatus('טוען תמונות ומכין ניתוח...');

        try {
            const parts = [];

            // העלאת תמונה ראשית
            const mainBase64 = await fileToBase64(mainImageFile);
            parts.push({ text: 'Main central character photo (Person 1):' });
            parts.push({
                inline_data: {
                    mime_type: mainImageFile.type,
                    data: mainBase64
                }
            });

            // העלאת תמונות נוספות
            for (let i = 0; i < extraImageFiles.length; i++) {
                const file = extraImageFiles[i];
                const extraBase64 = await fileToBase64(file);
                parts.push({ text: `Separate secondary character photo (Person ${i + 2}):` });
                parts.push({
                    inline_data: {
                        mime_type: file.type,
                        data: extraBase64
                    }
                });
            }

            // הנחיית ניתוח ויזואלי מפורטת ל-Gemini
            const promptInstruction = `Analyze all provided person photos carefully. Extract key distinctive facial traits (hair style/color, age, jawline, eye shape, nose shape, smile, facial hair if any). ` +
                `Construct a highly detailed English image generation prompt to generate a new cohesive single artwork containing all these persons rendered in style: "${style}", setting/scene: "${scene}". ` +
                `Ensure the main person (Person 1) is clearly recognizable based on their facial features. ` +
                (signText ? `Include a clear cardboard sign held by Person 1 displaying the text: "${signText}". ` : '') +
                `Output ONLY the raw detailed English prompt string, with no markdown or extra intro text.`;

            parts.push({ text: promptInstruction });

            setStatus('מנתח תווי פנים מול Google Gemini...');
            let geminiData = await callGeminiApi(apiKey, 'gemini-3.6-flash', 'v1', parts);

            if (geminiData.error) {
                console.warn('gemini-3.6-flash failed, trying gemini-1.5-flash...', geminiData.error);
                setStatus('מנסה מודל גיבוי...');
                geminiData = await callGeminiApi(apiKey, 'gemini-1.5-flash', 'v1', parts);
            }

            if (geminiData.error) {
                throw new Error(`שגיאת גוגל (${geminiData.error.code}): ${geminiData.error.message}`);
            }

            const detailedPrompt = geminiData.candidates?.[0]?.content?.parts?.[0]?.text?.trim();

            if (!detailedPrompt) {
                throw new Error('התקבלה תשובה ריקה מגוגל.');
            }

            // הפקת התמונה המעובדת והמאוחדת משרתי ה-AI
            setStatus('מפיק את התמונה המעובדת...');
            const seed = Math.floor(Math.random() * 1000000);
            const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(detailedPrompt)}?width=1024&height=1024&seed=${seed}&nologo=true&model=flux`;

            const img = new Image();
            img.onload = function() {
                resultImage.src = imageUrl;
                downloadBtn.href = imageUrl;
                setStatus('');
                loader.style.display = 'none';
                resultContainer.style.display = 'block';
                generateBtn.disabled = false;
            };
            img.onerror = function() {
                alert('אירעה שגיאה בטעינת התמונה, נסה שוב.');
                setStatus('');
                loader.style.display = 'none';
                generateBtn.disabled = false;
            };
            img.src = imageUrl;

        } catch (err) {
            console.error(err);
            alert(err.message || 'שגיאה בתקשורת מול גוגל. בדוק את מפתח ה-API.');
            setStatus('');
            loader.style.display = 'none';
            generateBtn.disabled = false;
        }
    });
</script>

</body>
</html>
