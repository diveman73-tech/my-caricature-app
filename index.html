<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מחולל הקריקטורות והתמונות שלי</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 8px;
        }

        p.subtitle {
            text-align: center;
            color: #64748b;
            font-size: 0.95rem;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input[type="file"], select, input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            background-color: #fff;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        #result-container {
            margin-top: 24px;
            text-align: center;
            display: none;
        }

        #result-image {
            max-width: 100%;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            margin-top: 12px;
        }

        .loader {
            display: none;
            margin: 20px auto;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>יוצר הקריקטורות והתמונות</h1>
    <p class="subtitle">בחר תמונות וענה על השאלות כדי ליצור תמונה ייחודית ב-AI</p>

    <form id="caricature-form">
        <!-- מפתח API של Gemini -->
        <div class="form-group">
            <label>מפתח Gemini API (חינמי):</label>
            <input type="password" id="api-key" placeholder="הדבק את מפתח ה-API מ-Google AI Studio" required>
        </div>

        <!-- העלאת תמונה ראשית -->
        <div class="form-group">
            <label>1. תמונה ראשית (הדמות המרכזית):</label>
            <input type="file" id="main-image" accept="image/*" required>
        </div>

        <!-- העלאת תמונות נוספות -->
        <div class="form-group">
            <label>2. תמונות נוספות של אנשים (אופציונלי):</label>
            <input type="file" id="extra-images" accept="image/*" multiple>
        </div>

        <!-- בחירת סגנון -->
        <div class="form-group">
            <label>3. בחר סגנון ויזואלי:</label>
            <select id="style-select">
                <option value="caricature with exaggerated features, big head, funny cartoon style">קריקטורה מצחיקה (ראש גדול, קווים מובלטים)</option>
                <option value="photorealistic street photo, natural outdoor lighting, detailed faces, meme style">תמונה מציאותית / מם (כמו צילום אמיתי ברחוב)</option>
                <option value="3D Pixar Disney style animation, vibrant colors, expressive faces">אנימציית תלת-ממד (סגנון פיקסאר/דיסני)</option>
                <option value="comic book illustration, bold ink lines, vibrant colors">סגנון קומיקס בצבעים חזקים</option>
            </select>
        </div>

        <!-- בחירת סצנה/רקע -->
        <div class="form-group">
            <label>4. איפה הדמויות נמצאות?</label>
            <select id="scene-select">
                <option value="sitting on a city sidewalk street background">יושבים על מדרכה ברחוב העיר</option>
                <option value="celebrating at a festive birthday party with colorful balloons">במסיבת יום הולדת שמחה עם בלונים</option>
                <option value="relaxing at a tropical beach with palm trees and ocean">על חוף ים טרופי עם עצי דקל</option>
                <option value="in a modern high-tech office environment">במשרד הייטק מודרני</option>
                <option value="dressed as superheroes on top of a skyscraper">כגיבורי על בראש גורד שחקים</option>
            </select>
        </div>

        <!-- טקסט לשלט -->
        <div class="form-group">
            <label>5. טקסט לשלט (אופציונלי):</label>
            <input type="text" id="sign-text" placeholder="למשל: Will build AI agents for coffee או מזל טוב!">
        </div>

        <button type="submit" class="btn" id="generate-btn">צור תמונה!</button>
    </form>

    <div class="loader" id="loader"></div>

    <div id="result-container">
        <h2>התמונה שלך מוכנה!</h2>
        <img id="result-image" src="" alt="תוצאה">
        <br><br>
        <a id="download-btn" class="btn" style="display:inline-block; text-decoration:none; width:auto; padding:10px 20px;" download="my-image.jpg" target="_blank">הורד תמונה</a>
    </div>
</div>

<script>
    // המרת קובץ תמונה ל-Base64
    function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.onerror = error => reject(error);
        });
    }

    document.getElementById('caricature-form').addEventListener('submit', async function(e) {
        e.preventDefault();

        const apiKey = document.getElementById('api-key').value.trim();
        const generateBtn = document.getElementById('generate-btn');
        const loader = document.getElementById('loader');
        const resultContainer = document.getElementById('result-container');
        const resultImage = document.getElementById('result-image');
        const downloadBtn = document.getElementById('download-btn');

        const mainImageFile = document.getElementById('main-image').files[0];
        const extraImageFiles = Array.from(document.getElementById('extra-images').files);

        const style = document.getElementById('style-select').value;
        const scene = document.getElementById('scene-select').value;
        const signText = document.getElementById('sign-text').value.trim();

        generateBtn.disabled = true;
        loader.style.display = 'block';
        resultContainer.style.display = 'none';

        try {
            // הפיכת התמונה הראשית ל-Base64
            const mainImageBase64 = await fileToBase64(mainImageFile);
            
            const contentsParts = [
                {
                    inline_data: {
                        mime_type: mainImageFile.type,
                        data: mainImageBase64
                    }
                }
            ];

            // הוספת תמונות נוספות
            for (const file of extraImageFiles) {
                const b64 = await fileToBase64(file);
                contentsParts.push({
                    inline_data: {
                        mime_type: file.type,
                        data: b64
                    }
                });
            }

            // בניית ההנחיה המפורטת
            let promptText = `Generate a new image based on the provided face(s). Style: ${style}. Scene: ${scene}. Keep the facial likeness of the person in the main image as the central character.`;
            if (extraImageFiles.length > 0) {
                promptText += ` Incorporate the additional faces as surrounding characters in the scene.`;
            }
            if (signText) {
                promptText += ` The central character should hold a cardboard sign with the text: "${signText}".`;
            }

            contentsParts.push({ text: promptText });

            // פנייה ל-API של Gemini Flash
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: contentsParts }]
                })
            });

            const data = await response.json();
            
            if (data.candidates && data.candidates[0].content.parts) {
                // חיפוש תמונה בתוצאות
                const imagePart = data.candidates[0].content.parts.find(p => p.inline_data);
                if (imagePart) {
                    const imgUrl = `data:${imagePart.inline_data.mime_type};base64,${imagePart.inline_data.data}`;
                    resultImage.src = imgUrl;
                    downloadBtn.href = imgUrl;
                    resultContainer.style.display = 'block';
                } else {
                    alert('המפתח עובד, אך המודל החזיר תשובת טקסט. ודא כי לחשבונך מופעלת גישה ליצירת תמונות.');
                }
            } else {
                alert('שגיאה בתקשורת מול גוגל. בדוק את מפתח ה-API שהכנסת.');
            }
        } catch (err) {
            console.error(err);
            alert('אירעה שגיאה בעיבוד התמונה.');
        } finally {
            loader.style.display = 'none';
            generateBtn.disabled = false;
        }
    });
</script>

</body>
</html>
