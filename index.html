<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מחולל הקריקטורות והתמונות שלי</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 8px;
        }

        p.subtitle {
            text-align: center;
            color: #64748b;
            font-size: 0.95rem;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input[type="file"], select, input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            background-color: #fff;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        #result-container {
            margin-top: 24px;
            text-align: center;
            display: none;
        }

        #result-canvas {
            max-width: 100%;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            margin-top: 12px;
        }

        .loader {
            display: none;
            margin: 20px auto;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>יוצר הקריקטורות והתמונות שלי</h1>
    <p class="subtitle">העלה את פניך ושלב אותן בתוך סצנות וקריקטורות מדליקות</p>

    <form id="caricature-form">
        <!-- העלאת תמונה ראשית -->
        <div class="form-group">
            <label>1. תמונת הפנים שלך (חובה):</label>
            <input type="file" id="main-image" accept="image/*" required>
        </div>

        <!-- בחירת סגנון -->
        <div class="form-group">
            <label>2. בחר סגנון קריקטורה/סצנה:</label>
            <select id="style-select">
                <option value="caricature, funny body with big head style, cartoon artwork">קריקטורה מצחיקה (ראש מובלט)</option>
                <option value="photorealistic street portrait background, natural outdoor">תמונה מציאותית / מם</option>
                <option value="3D Pixar Disney superhero character style animation">אנימציית תלת-ממד (סגנון פיקסאר/דיסני)</option>
                <option value="comic book illustration style, bold ink lines">סגנון קומיקס בצבעים חזקים</option>
            </select>
        </div>

        <!-- בחירת סצנה/רקע -->
        <div class="form-group">
            <label>3. איפה הדמות תהיה?</label>
            <select id="scene-select">
                <option value="sitting on a city sidewalk street background">יושב על מדרכה ברחוב העיר</option>
                <option value="celebrating at a festive birthday party with colorful balloons">במסיבת יום הולדת שמחה עם בלונים</option>
                <option value="relaxing at a tropical beach with palm trees and ocean">על חוף ים טרופי עם עצי דקל</option>
                <option value="in a modern high-tech office environment">במשרד הייטק מודרני</option>
                <option value="dressed as superheroes on top of a skyscraper">כגיבור על בראש גורד שחקים</option>
            </select>
        </div>

        <!-- טקסט לשלט -->
        <div class="form-group">
            <label>4. טקסט לשלט (אופציונלי):</label>
            <input type="text" id="sign-text" placeholder="למשל: Will build AI agents for coffee או מזל טוב!">
        </div>

        <button type="submit" class="btn" id="generate-btn">צור תמונה!</button>
    </form>

    <div class="loader" id="loader"></div>

    <div id="result-container">
        <h2>התמונה שלך מוכנה!</h2>
        <canvas id="result-canvas"></canvas>
        <br><br>
        <a id="download-btn" class="btn" style="display:inline-block; text-decoration:none; width:auto; padding:10px 20px;" download="my-caricature.jpg">הורד תמונה</a>
    </div>
</div>

<script>
    function loadImage(src) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.crossOrigin = 'Anonymous';
            img.onload = () => resolve(img);
            img.onerror = (e) => reject(e);
            img.src = src;
        });
    }

    function readFileAsDataURL(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    document.getElementById('caricature-form').addEventListener('submit', async function(e) {
        e.preventDefault();

        const generateBtn = document.getElementById('generate-btn');
        const loader = document.getElementById('loader');
        const resultContainer = document.getElementById('result-container');
        const canvas = document.getElementById('result-canvas');
        const ctx = canvas.getContext('2d');
        const downloadBtn = document.getElementById('download-btn');

        const mainImageFile = document.getElementById('main-image').files[0];
        const style = document.getElementById('style-select').value;
        const scene = document.getElementById('scene-select').value;
        const signText = document.getElementById('sign-text').value.trim();

        generateBtn.disabled = true;
        loader.style.display = 'block';
        resultContainer.style.display = 'none';

        try {
            // 1. טעינת תמונת הפנים המקורית של המשתמש
            const userImageBase64 = await readFileAsDataURL(mainImageFile);
            const userImg = await loadImage(userImageBase64);

            // 2. יצירת סצנת הרקע/הגוף לפי הבחירה
            const seed = Math.floor(Math.random() * 1000000);
            let prompt = `A full body character in ${style}, set in ${scene}, facing forward, head clearly visible`;
            if (signText) {
                prompt += `, holding a sign with text "${signText}"`;
            }
            const backgroundUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=1024&height=1024&seed=${seed}&nologo=true&model=flux`;
            
            const bgImg = await loadImage(backgroundUrl);

            // 3. הגדרת מידות הקנבס
            canvas.width = 1024;
            canvas.height = 1024;

            // ציור הרקע
            ctx.drawImage(bgImg, 0, 0, 1024, 1024);

            // 4. חיתוך ומיזוג פני המשתמש המקוריים אל ראש הדמות (Face Overlay Fusion)
            const headSize = 340;
            const headX = (canvas.width - headSize) / 2;
            const headY = 160;

            ctx.save();
            ctx.beginPath();
            // יצירת מסיכה אליפטית שקופה למראה טבעי של הראש
            ctx.ellipse(headX + headSize / 2, headY + headSize / 2, headSize / 2, headSize / 1.7, 0, 0, 2 * Math.PI);
            ctx.closePath();
            ctx.clip();

            // ציור הפנים של המשתמש המקורי
            ctx.drawImage(userImg, headX, headY, headSize, headSize);
            ctx.restore();

            // 5. עדכון כפתור ההורדה
            downloadBtn.href = canvas.toDataURL('image/jpeg');
            
            loader.style.display = 'none';
            resultContainer.style.display = 'block';
            generateBtn.disabled = false;

        } catch (err) {
            console.error(err);
            alert('אירעה שגיאה ביצירת התמונה. נסה שוב.');
            loader.style.display = 'none';
            generateBtn.disabled = false;
        }
    });
</script>

</body>
</html>
